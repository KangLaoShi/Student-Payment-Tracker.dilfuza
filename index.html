<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSRE Dashboard - Private Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --brand-green: #2C5F56;
            --brand-mint: #F1F8F6;
            --brand-yellow: #FFC554;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: var(--brand-mint);
            color: #1A2E35;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #D1DEDC; border-radius: 10px; }

        .card-modern {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            box-shadow: 0 4px 20px -2px rgba(44, 95, 86, 0.04);
            border: 1px solid rgba(255, 255, 255, 1);
        }

        .btn-active:active { transform: scale(0.95); }
        .hover-lift { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(44, 95, 86, 0.08); }

        .filter-chip {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
            border: 1px solid #D1DEDC;
            color: #64748b;
            transition: all 0.2s;
        }
        .filter-chip:hover { border-color: var(--brand-green); color: var(--brand-green); }
        .filter-chip.active { 
            background: var(--brand-green); 
            color: white; 
            box-shadow: 0 10px 15px -3px rgba(44, 95, 86, 0.2);
            border-color: var(--brand-green);
        }
        
        .lang-item.active { background-color: var(--brand-green); color: white; font-weight: 800; }

        .pin-mask { -webkit-text-security: disc; }

        .bg-mesh {
            background-color: var(--brand-mint);
            background-image: radial-gradient(at 0% 0%, rgba(44, 95, 86, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 0%, rgba(255, 197, 84, 0.03) 0px, transparent 50%);
        }

        .table-row-modern { transition: all 0.2s; }
        .table-row-modern:hover { background-color: rgba(44, 95, 86, 0.04); }
    </style>
</head>
<body class="bg-mesh min-h-screen">
    
    <div id="entry-gate" class="fixed inset-0 z-[500] flex items-center justify-center p-4 bg-[#1A2E35]">
        <div class="absolute inset-0 opacity-10" style="background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');"></div>
        <div class="bg-white rounded-[40px] shadow-2xl w-full max-w-md p-12 text-center relative z-10 border-t-8 border-[#2C5F56]">
            <div class="mb-8 text-center">
                <img src="./logo.png" alt="Logo" class="h-16 w-auto mx-auto object-contain drop-shadow-md hidden" onerror="this.style.display='none'; document.getElementById('logo-fallback').classList.remove('hidden');" />
                <div id="logo-fallback" class="w-20 h-20 bg-[#2C5F56] rounded-[28px] mx-auto flex items-center justify-center shadow-2xl">
                    <span class="text-white font-black text-2xl italic">NS</span>
                </div>
            </div>
            <h2 id="portal-title" class="text-2xl font-[800] text-[#1A2E35] mb-2 tracking-tight">内部教学记录系统</h2>
            <p id="portal-subtitle" class="text-[#2C5F56] font-bold mb-10 text-xs uppercase tracking-[0.2em]">私有教学管理面板</p>
            
            <div id="auth-container" class="space-y-5 text-left mb-6">
                <div><input id="entry-name" type="text" class="w-full px-6 py-5 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none focus:ring-2 focus:ring-[#2C5F56]/10" placeholder="教师姓名 (例如: Kanglaoshi)"></div>
                <div><input id="entry-pin" type="password" class="w-full px-6 py-5 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none focus:ring-2 focus:ring-[#2C5F56]/10" placeholder="访问识别码 (PIN)"></div>
                <button id="btn-enter" class="w-full bg-[#2C5F56] text-white py-5 rounded-3xl font-bold shadow-xl hover:opacity-90 active:scale-[0.98] transition-all mt-2 text-sm">进入工作台</button>
            </div>

            <div class="flex justify-center gap-3 border-t border-slate-50 pt-6">
                <button onclick="setLang('zh')" class="text-[10px] font-black text-slate-400 hover:text-[#2C5F56]">ZH</button>
                <button onclick="setLang('uz')" class="text-[10px] font-black text-slate-400 hover:text-[#2C5F56]">UZ</button>
                <button onclick="setLang('ru')" class="text-[10px] font-black text-slate-400 hover:text-[#2C5F56]">RU</button>
                <button onclick="setLang('en')" class="text-[10px] font-black text-slate-400 hover:text-[#2C5F56]">EN</button>
            </div>
            <p id="auth-error" class="text-rose-500 text-xs font-bold mt-6 hidden">识别码错误，请重新输入。</p>
        </div>
    </div>

    <div id="app-content" class="max-w-[1440px] mx-auto p-4 md:p-8 hidden">
        <header class="relative z-[100] flex flex-col lg:flex-row lg:items-center justify-between mb-10 gap-6 bg-white/50 p-6 rounded-[32px] border border-white shadow-sm backdrop-blur-md">
            <div class="flex flex-col">
                <h1 id="page-title-main" class="text-2xl md:text-3xl font-[900] text-[#1A2E35]">学生付费跟进管理</h1>
                <p id="page-subtitle" class="text-[#2C5F56]/50 font-bold text-[10px] uppercase tracking-[0.2em] mt-1">协作版 · 实时云同步</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <div class="relative group">
                    <button class="flex items-center gap-2 bg-white px-5 h-[52px] rounded-full text-[#1A2E35] border border-[#D1DEDC] font-bold text-[10px] uppercase tracking-widest">
                        <i data-lucide="globe" class="w-3.5 h-3.5 text-[#2C5F56]"></i>
                        <span id="current-lang-text">ZH</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 text-slate-300"></i>
                    </button>
                    <div class="absolute right-0 mt-2 w-44 bg-white border border-[#D1DEDC] rounded-[24px] shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-[150] overflow-hidden p-2">
                        <button onclick="setLang('zh')" class="lang-item w-full text-left px-5 py-2.5 text-[10px] font-bold rounded-xl transition-colors mb-1 active">中文 (ZH)</button>
                        <button onclick="setLang('uz')" class="lang-item w-full text-left px-5 py-2.5 text-[10px] font-bold rounded-xl transition-colors mb-1">O'zbek (UZ)</button>
                        <button onclick="setLang('ru')" class="lang-item w-full text-left px-5 py-2.5 text-[10px] font-bold rounded-xl transition-colors mb-1">Русский (RU)</button>
                        <button onclick="setLang('en')" class="lang-item w-full text-left px-5 py-2.5 text-[10px] font-bold rounded-xl transition-colors">English (EN)</button>
                    </div>
                </div>
                <div class="flex items-center gap-3 bg-[#1A2E35] px-5 h-[52px] rounded-full shadow-lg">
                    <div class="w-8 h-8 bg-[#FFC554] text-[#1A2E35] rounded-lg flex items-center justify-center font-black text-[10px]" id="user-avatar">?</div>
                    <span id="logged-user-name" class="text-[11px] font-bold text-white tracking-tight">---</span>
                    <button onclick="logout()" class="ml-1 text-slate-500 hover:text-rose-400 transition-colors"><i data-lucide="power" class="w-3.5 h-3.5"></i></button>
                </div>
                <button onclick="openAddModal()" class="btn-active flex items-center gap-2 bg-[#2C5F56] text-white px-6 h-[52px] rounded-full shadow-xl shadow-[#2C5F56]/20 font-bold text-xs">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i><span id="add-btn-text">添加学生</span>
                </button>
            </div>
        </header>

        <main class="space-y-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div onclick="setStatusFilter('all')" class="card-modern p-6 flex items-center gap-6 hover-lift border-l-8 border-[#2C5F56] cursor-pointer transition-all active:scale-95">
                    <div class="w-14 h-14 bg-[#F0F6F5] text-[#2C5F56] rounded-2xl flex items-center justify-center"><i data-lucide="users-2" class="w-6 h-6"></i></div>
                    <div><p id="stat-total-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">学生总数</p><p id="stat-total-val" class="text-3xl font-[900] text-[#1A2E35]">0</p></div>
                </div>
                <div onclick="setStatusFilter('warning')" class="card-modern p-6 flex items-center gap-6 hover-lift border-l-8 border-[#FFC554] cursor-pointer transition-all active:scale-95">
                    <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center"><i data-lucide="hourglass" class="w-6 h-6"></i></div>
                    <div><p id="stat-warning-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">即将到期</p><p id="stat-warning-val" class="text-3xl font-[900] text-[#1A2E35]">0</p></div>
                </div>
                <div onclick="setStatusFilter('overdue')" class="card-modern p-6 flex items-center gap-6 hover-lift border-l-8 border-rose-500 cursor-pointer transition-all active:scale-95">
                    <div class="w-14 h-14 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center"><i data-lucide="alert-octagon" class="w-6 h-6"></i></div>
                    <div><p id="stat-overdue-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">欠费预警</p><p id="stat-overdue-val" class="text-3xl font-[900] text-rose-500">0</p></div>
                </div>
                <div onclick="setStatusFilter('frozen')" class="card-modern p-6 flex items-center gap-6 hover-lift border-l-8 border-blue-500 cursor-pointer transition-all active:scale-95">
                    <div class="w-14 h-14 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center"><i data-lucide="snowflake" class="w-6 h-6"></i></div>
                    <div><p id="stat-frozen-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">冻结账户</p><p id="stat-frozen-val" class="text-3xl font-[900] text-blue-500">0</p></div>
                </div>
            </div>

            <div class="card-modern p-5 space-y-4">
                <div id="teacher-filter-wrap" class="hidden flex flex-col gap-2">
                    <span id="filter-label" class="text-[10px] font-black text-[#2C5F56]/60 uppercase ml-1">负责人:</span>
                    <div id="teacher-filter-container" class="flex flex-wrap gap-2"></div>
                </div>
                <div id="class-filter-wrap" class="flex flex-col gap-2 pt-2 border-t border-slate-100">
                    <span id="filter-class-label" class="text-[10px] font-black text-[#2C5F56]/60 uppercase ml-1">班级筛选:</span>
                    <div id="class-filter-container" class="flex flex-wrap gap-2"></div>
                </div>
                <div id="status-filter-wrap" class="flex flex-col gap-2 pt-2 border-t border-slate-100 hidden">
                    <!-- Status Filter is integrated into the stats cards above for better UX -->
                </div>
            </div>

            <div class="card-modern overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left whitespace-nowrap">
                        <thead class="bg-[#F7FAF9]/80 border-b border-slate-100">
                            <tr id="table-head-row">
                                <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-wider" data-i18n="thName">学生姓名</th>
                                <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-wider" data-i18n="thTeacher">负责老师</th>
                                <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-wider" data-i18n="thClass">班级</th>
                                <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-wider" data-i18n="thProgress">进度</th>
                                <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-wider" data-i18n="thRemaining">剩余</th>
                                <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-wider text-center" data-i18n="thStatus">状态</th>
                                <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-wider text-right" data-i18n="thActions">管理操作</th>
                            </tr>
                        </thead>
                        <tbody id="student-table-body" class="divide-y divide-slate-50">
                            <!-- Rows rendered by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Form Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-[#1A2E35]/90 backdrop-blur-lg hidden items-center justify-center p-4 z-[600]">
        <div class="bg-white rounded-[40px] shadow-2xl w-full max-w-md p-10 overflow-y-auto max-h-[90vh] border-t-8 border-[#FFC554]">
            <div class="flex justify-between items-center mb-10">
                <h3 id="modal-title" class="text-2xl font-[900]">编辑信息</h3>
                <button onclick="toggleModal(false)" class="p-3 text-slate-300 hover:text-rose-500"><i data-lucide="x"></i></button>
            </div>
            <form id="student-form" class="space-y-5 text-left">
                <input type="hidden" id="input-id">
                <div><label id="label-name" class="text-[10px] font-black text-slate-400 uppercase ml-4 mb-1 block">姓名</label>
                <input id="input-name" type="text" required class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none focus:ring-2 focus:ring-[#2C5F56]/20" placeholder="输入姓名"></div>
                
                <div><label id="label-contract" class="text-[10px] font-black text-slate-400 uppercase ml-4 mb-1 block">合同号</label>
                <input id="input-contract" type="text" class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none focus:ring-2 focus:ring-[#2C5F56]/20" placeholder="输入合同号"></div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div><label id="label-teacher" class="text-[10px] font-black text-slate-400 uppercase ml-4 mb-1 block">负责老师</label>
                    <select id="input-teacher" required class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none appearance-none focus:ring-2 focus:ring-[#2C5F56]/20"></select></div>
                    <div><label id="label-class" class="text-[10px] font-black text-slate-400 uppercase ml-4 mb-1 block">班级</label>
                    <input id="input-class" list="class-list" type="text" required class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none focus:ring-2 focus:ring-[#2C5F56]/20" placeholder="填写班级"></div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div><label id="label-total" class="text-[10px] font-black text-slate-400 uppercase ml-4 mb-1 block">总课时</label>
                    <select id="input-total" class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none focus:ring-2 focus:ring-[#2C5F56]/20">
                        <option value="10">10 课时</option>
                        <option value="20">20 课时</option>
                        <option value="30">30 课时</option>
                        <option value="40">40 课时</option>
                        <option value="50">50 课时</option>
                        <option value="60">60 课时</option>
                        <option value="100">100 课时</option>
                    </select></div>
                    <div><label id="label-used" class="text-[10px] font-black text-slate-400 uppercase ml-4 mb-1 block">已用课时</label>
                    <input id="input-used" type="number" required min="0" value="0" class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none focus:ring-2 focus:ring-[#2C5F56]/20"></div>
                </div>
                
                <div><label id="label-date" class="text-[10px] font-black text-slate-400 uppercase ml-4 mb-1 block">最近付费日期</label>
                <input id="input-date" type="date" required class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none focus:ring-2 focus:ring-[#2C5F56]/20"></div>
                
                <div class="flex gap-4 pt-6">
                    <button type="button" onclick="toggleModal(false)" id="btn-cancel" class="flex-1 py-4 bg-slate-100 rounded-3xl font-black text-slate-500 hover:bg-slate-200">取消</button>
                    <button type="submit" id="btn-save" class="flex-1 py-4 bg-[#2C5F56] text-white rounded-3xl font-black hover:opacity-90 shadow-xl shadow-[#2C5F56]/30">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal-overlay" class="fixed inset-0 bg-[#1A2E35]/95 backdrop-blur-xl hidden items-center justify-center p-4 z-[700]">
        <div class="bg-white rounded-[40px] shadow-2xl w-full max-w-md p-12 flex flex-col max-h-[90vh] border-t-8 border-[#FFC554]">
            <div class="flex justify-between items-start mb-8 shrink-0">
                <div class="flex flex-col gap-2">
                    <h3 id="history-modal-title" class="text-2xl font-[900] text-[#1A2E35] tracking-tight">上课记录</h3>
                    <div id="history-contract-container" class="hidden flex items-center gap-2">
                        <span class="text-[11px] font-bold text-slate-500 uppercase tracking-widest bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200" id="history-contract-display"></span>
                        <button onclick="copyContractNumber()" id="btn-copy-contract" class="p-1.5 bg-white border border-slate-200 text-slate-400 hover:text-[#2C5F56] hover:border-[#2C5F56] rounded-lg transition-all shadow-sm flex items-center justify-center cursor-pointer">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
                <button onclick="toggleHistoryModal(false)" class="p-3 bg-slate-50 rounded-full text-slate-400 hover:text-rose-500 transition-colors"><i data-lucide="x"></i></button>
            </div>
            <div class="flex gap-3 mb-6 shrink-0 bg-slate-50 p-2 rounded-3xl">
                <input type="date" id="manual-date-input" class="flex-1 px-4 py-3 bg-white rounded-2xl font-bold border border-slate-100 text-sm outline-none">
                <button onclick="handleRecordAction()" id="btn-record-action" class="px-6 py-3 bg-[#2C5F56] text-white rounded-2xl font-black text-sm">补签记录</button>
            </div>
            <div id="history-list" class="space-y-3 overflow-y-auto pr-2 no-scrollbar flex-1 mb-8 min-h-[200px]">
                <!-- History items injected by JS -->
            </div>
            <button onclick="toggleHistoryModal(false)" id="btn-close-history" class="w-full py-4 bg-[#F7FAF9] text-slate-500 rounded-3xl font-black hover:bg-slate-100">关闭窗口</button>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal-overlay" class="fixed inset-0 bg-[#1A2E35]/95 backdrop-blur-xl hidden items-center justify-center p-4 z-[999]">
        <div class="bg-white rounded-[32px] p-8 text-center border-t-8 border-rose-500 w-full max-w-sm shadow-2xl">
            <div class="w-16 h-16 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="alert-triangle" class="w-8 h-8"></i>
            </div>
            <h3 id="confirm-modal-title" class="text-xl font-[900] mb-2 text-slate-800">确认操作</h3>
            <p id="confirm-modal-msg" class="text-slate-500 text-sm mb-8 font-medium"></p>
            <div class="flex gap-4">
                <button id="confirm-btn-cancel" class="flex-1 py-4 bg-slate-100 rounded-2xl font-black text-slate-500 hover:bg-slate-200">取消</button>
                <button id="confirm-btn-ok" class="flex-1 py-4 bg-rose-500 text-white rounded-2xl font-black shadow-lg shadow-rose-500/30 hover:bg-rose-600">确认</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, updateDoc, deleteDoc, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const defaultFirebaseConfig = { 
            apiKey: "AIzaSyDsuB8A4RBJz3PlDvzAEhKA3FEDoDmFfh8", 
            authDomain: "studenttracker-a8384.firebaseapp.com",

            messagingSenderId: "181463996376", 
            appId: "1:181463996376:web:77b32e8a82a63c5eb004ad" 
        };
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultFirebaseConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-tracker';
        
        // System Data
        const teacherList = ["Kanglaoshi", "Pailaoshi", "Alaoshi", "Tielaoshi", "Lanyinglaoshi", "Zenglaoshi"];

                if (wA !== wB) return wA - wB;

                console.error("Error saving student:", error);
                alert("保存失败，请检查网络连接。");
            } finally {
                btn.disabled = false;
                btn.innerText = tDict[currentLang].btnSave;
            }
        });

        window.deleteStudent = (id) => {
            customConfirm(tDict[currentLang].confirmDelete, async () => {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id));
                } catch (error) {
                    console.error("Error deleting student:", error);
                }
            });
        };

        window.toggleFreeze = async (id, currentStatus) => {
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id), { isFrozen: !currentStatus });
            } catch (error) {
                console.error("Error toggling freeze:", error);
            }
        };

        window.addRecord = async (studentId, isAbsent) => {
            const student = students.find(s => s.id === studentId);
            if (!student || student.isFrozen) return;

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0]; // YYYY-MM-DD
            
            const newRecord = {
                id: Date.now().toString(),
                date: dateStr,
                timestamp: now.getTime(),
                isAbsent: isAbsent,
                addedBy: loggedUser
            };

            const updatedHistory = [...(student.history || []), newRecord];
            const newUsed = Number(student.used || 0) + 1;

            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', studentId), {
                    history: updatedHistory,
                    used: newUsed
                });
            } catch (error) {
                console.error("Error adding record:", error);
            }
        };

        window.openHistoryModal = (studentId) => {
            currentHistoryStudentId = studentId;
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            const t = tDict[currentLang];
            
            // Handle contract display
            const contractContainer = document.getElementById('history-contract-container');
            const contractDisplay = document.getElementById('history-contract-display');
            if (student.contract) {
                contractContainer.classList.remove('hidden');
                contractContainer.setAttribute('data-contract', student.contract);
                contractDisplay.innerText = student.contract;
            } else {
                contractContainer.classList.add('hidden');
                contractContainer.removeAttribute('data-contract');
            }

            document.getElementById('manual-date-input').valueAsDate = new Date();

            const list = document.getElementById('history-list');
            list.innerHTML = '';
            
            const history = (student.history || []).sort((a, b) => b.timestamp - a.timestamp); // Newest first
            
            if (history.length === 0) {
                list.innerHTML = `<div class="text-center text-slate-400 font-bold text-sm py-10 bg-slate-50 rounded-3xl">${t.historyEmpty}</div>`;
            } else {
                history.forEach(record => {
                    const d = new Date(record.date);
                    const dayName = t.days[d.getDay()];
                    
                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center p-4 bg-white rounded-2xl border border-slate-100 shadow-sm mb-2';
                    item.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl ${record.isAbsent ? 'bg-amber-50 text-amber-500' : 'bg-emerald-50 text-emerald-500'} flex items-center justify-center font-bold">
                                <i data-lucide="${record.isAbsent ? 'user-minus' : 'check'}" class="w-5 h-5"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="font-[800] text-[#1A2E35] text-sm">${record.date} <span class="text-xs text-slate-400 ml-1">(${dayName})</span></span>
                                <span class="text-[10px] font-bold ${record.isAbsent ? 'text-amber-500' : 'text-slate-400'} uppercase tracking-widest">${record.isAbsent ? t.absentMark : 'Class Attended'} • Added by ${record.addedBy || 'System'}</span>
                            </div>
                        </div>
                        <button onclick="deleteRecord('${record.id}')" class="p-2 text-slate-300 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-all">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    `;
                    list.appendChild(item);
                });
            }
            
            lucide.createIcons();
            window.toggleHistoryModal(true);
        };

        window.handleRecordAction = async () => {
            if (!currentHistoryStudentId) return;
            const student = students.find(s => s.id === currentHistoryStudentId);
            if (!student) return;

            const dateInput = document.getElementById('manual-date-input').value;
            if (!dateInput) return;

            const btn = document.getElementById('btn-record-action');
            btn.disabled = true;

            const newRecord = {
                id: Date.now().toString(),
                date: dateInput,
                timestamp: new Date(dateInput).getTime(),
                isAbsent: false, // Manual adds are mostly attendances
                addedBy: loggedUser
            };

            const updatedHistory = [...(student.history || []), newRecord];
            const newUsed = Number(student.used || 0) + 1;

            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', currentHistoryStudentId), {
                    history: updatedHistory,
                    used: newUsed
                });
                // Snapshot listener will trigger re-render of modal
            } catch (error) {
                console.error("Error manually adding record:", error);
            } finally {
                btn.disabled = false;
            }
        };

        window.deleteRecord = (recordId) => {
            customConfirm(tDict[currentLang].confirmDeleteRecord, async () => {
                if (!currentHistoryStudentId) return;
                const student = students.find(s => s.id === currentHistoryStudentId);
                if (!student) return;

                const recordToRemove = (student.history || []).find(r => r.id === recordId);
                if (!recordToRemove) return;

                const updatedHistory = (student.history || []).filter(r => r.id !== recordId);
                // Only decrement used count if it wasn't a manual adjustment that didn't affect count originally (simplify logic here: always decrement)
                const newUsed = Math.max(0, Number(student.used || 0) - 1);

                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', currentHistoryStudentId), {
                        history: updatedHistory,
                        used: newUsed
                    });
                } catch (error) {
                    console.error("Error deleting record:", error);
                }
            });
        };

        window.copyContractNumber = () => {
            const container = document.getElementById('history-contract-container');
            const textToCopy = container.getAttribute('data-contract');
            if (!textToCopy) return;

            // Using modern clipboard API if available, fallback to execCommand
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(showCopySuccess);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                textArea.style.position = "absolute";
                textArea.style.left = "-999999px";
                document.body.prepend(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopySuccess();
                } catch (error) {
                    console.error(error);
                } finally {
                    textArea.remove();
                }
            }
        };

        function showCopySuccess() {
            const icon = document.querySelector('#btn-copy-contract i');
            const originalColor = icon.className;
            icon.setAttribute('data-lucide', 'check');
            icon.classList.add('text-emerald-500');
            lucide.createIcons(); // Refresh icon
            
            setTimeout(() => {
                icon.setAttribute('data-lucide', 'copy');
                icon.className = originalColor; // Restore original classes
                lucide.createIcons();
            }, 1500);
        }

        const startApp = async () => {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app); 
            db = getFirestore(app);
            
            window.logout = () => { sessionStorage.removeItem('active_staff_session'); location.reload(); };
            window.setLang = (l) => { currentLang = l; render(); };
            window.setTeacherFilter = (t) => { selectedTeacher = t; selectedClass = 'all'; render(); };
            window.setClassFilter = (c) => { selectedClass = c; render(); };
            window.setStatusFilter = (s) => { selectedStatus = (selectedStatus === s ? 'all' : s); render(); };
            window.toggleModal = (show) => { document.getElementById('modal-overlay').style.display = show ? 'flex' : 'none'; };
            window.toggleHistoryModal = (show) => { document.getElementById('history-modal-overlay').style.display = show ? 'flex' : 'none'; if(!show) currentHistoryStudentId = null; };
            
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const studentsCol = collection(db, 'artifacts', appId, 'public', 'data', 'students');
                    onSnapshot(query(studentsCol), (snapshot) => {
                        students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        
                        // Auto-migrate Alaoshi
                        students.forEach(s => {
                            if (s.teacher === 'Anlaoshi') {
                                updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id), { teacher: 'Alaoshi' });
                            }
                        });

                        if (loggedUser) render();
                        
                        // Refresh history modal if open
                        if (currentHistoryStudentId && document.getElementById('history-modal-overlay').style.display === 'flex') {
                            window.openHistoryModal(currentHistoryStudentId);
                        }
                    }, (error) => {
                        console.error("Firestore error:", error);
                    });
                }
            });

            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            await initAuth();
            
            verifySession();

            const processAuth = () => {
                const name = document.getElementById('entry-name').value.trim();
                const pin = document.getElementById('entry-pin').value.trim();
                if (teacherPins[name] === pin) {
                    sessionStorage.setItem('active_staff_session', name);
                    verifySession();
                } else {
                    document.getElementById('auth-error').classList.remove('hidden');
                    setTimeout(() => document.getElementById('auth-error').classList.add('hidden'), 3000);
                }
            };

            document.getElementById('btn-enter').onclick = processAuth;
            document.getElementById('entry-pin').onkeypress = (e) => { if (e.key === 'Enter') processAuth(); };
            document.getElementById('entry-name').onkeypress = (e) => { if (e.key === 'Enter') processAuth(); };
            
            lucide.createIcons();
        };

        const verifySession = () => {
            let saved = sessionStorage.getItem('active_staff_session');
            
            if (saved === 'Anlaoshi') {
                saved = 'Alaoshi';
                sessionStorage.setItem('active_staff_session', 'Alaoshi');
            }

            if (saved && (teacherList.includes(saved) || saved === 'Director')) {
                loggedUser = saved; isAdmin = (saved === 'Director');
                document.getElementById('entry-gate').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('logged-user-name').innerText = isAdmin ? 'Director' : saved;
                document.getElementById('user-avatar').innerText = isAdmin ? 'D' : saved[0].toUpperCase();
                document.getElementById('teacher-filter-wrap').classList.toggle('hidden', !isAdmin);
                
                // Initialize translation on login
                updateTranslations();
                render();
            }
        };

        // Boot
        startApp();
    </script>
</body>
</html>
